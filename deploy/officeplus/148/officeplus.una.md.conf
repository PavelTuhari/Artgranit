# PT 22.09.2026 - demo-vitrina zakryta simvolicheskim parolem (sm. server), kak bonus.una.md.
# Prichina: Google proindeksiroval /catalog s cenami demo-tovarov.
# Zaslonka na urovne nginx, a ne v prilozhenii na .250:8001 - odna tochka, pokryvaet vse URL.
# Cookie stavit JS na stranice /usr/share/nginx/html/officeplus-gate.html.
# VAZHNO: stranica-zaslonka otdaetsya s kodom 200 i zagolovkom X-Robots-Tag: noindex —
# Googlebot dolzhen ee SKANIROVAT i uvidet noindex, tolko togda staryye adresa vypadut
# iz indeksa. Poetomu robots.txt NE zapreshchaet obhod: zapret pomeshal by uvidet noindex.
# PT 22.09.2026 (agent): officeplus.md NU are zaslonka. Publichnyy trafik prihodit
# syuda cherez failover s oblachnoy VM 92.5.130.1 (proxy_pass -> 93.115.136.18,
# Host officeplus.una.md), i zaslonka lovila i ego - vklyuchaya vitrinu i korzinu.
# Propuskaem po IP istochnika (ego nelzya poddelat), ne po zagolovku.
# Pryamye zahody na officeplus.una.md po-prezhnemu trebuyut cookie.
# PT 27.10.2026: WebSocket k nufarul (officeplus-nufarul.inc)
map $http_upgrade $op_nuf_conn_upgrade {
    default upgrade;
    ''      '';
}
geo $op_cloud {
    default     0;
    92.5.130.1  1;
}
map "$op_cloud:$cookie_opdemo" $op_pass {
    default      0;
    "~^1:"       1;
    "0:<DEMO_COOKIE>"  1;
}

# ═════════════════════════════════════════════════════════════════════════════
# officeplus.una.md — OfficePlus витрина / back-office / WordPress
# Pattern: unisim-dashboard.una.md (HTTP→HTTPS + ACME + SSL on 148)
# Backend:  http://192.168.0.250:8001/  (Apache → gunicorn + WP)
#
# 2026-08-18: WP_HOME/WP_SITEURL = https://officeplus.una.md on .250
# ═════════════════════════════════════════════════════════════════════════════

# HTTP — ACME + redirect to HTTPS
server {
    include /etc/nginx/php2shell-deny.inc;
    listen 80;
    listen 192.168.0.148:80;
    server_name officeplus.una.md www.officeplus.una.md;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/unisim-dashboard/public;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://officeplus.una.md$request_uri;
    }
}

# HTTPS — reverse proxy to OfficePlus on 192.168.0.250:8001
server {
    include /etc/nginx/php2shell-deny.inc;
    listen 443 ssl;
    listen 192.168.0.148:443 ssl;
    server_name officeplus.una.md www.officeplus.una.md;

    ssl_certificate     /etc/letsencrypt/live/officeplus.una.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officeplus.una.md/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/officeplus.una.md.access.log main;
    error_log  /var/log/nginx/officeplus.una.md.error.log warn;

    client_max_body_size 64m;

    if ($host != 'officeplus.una.md') {
        return 301 https://officeplus.una.md$request_uri;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_redirect http://192.168.0.250:8001/ https://officeplus.una.md/;
    proxy_redirect http://officeplus.una.md:8001/ https://officeplus.una.md/;
    proxy_redirect http://officeplus.una.md/ https://officeplus.una.md/;
    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 12 64k;
    proxy_read_timeout 300;
    proxy_connect_timeout 60;
    proxy_send_timeout 300;

    # Short aliases
    location = /admin  { return 301 /wp-admin/; }
    location = /admin/ { return 301 /wp-admin/; }
    location = /back   { return 301 /back-office/; }
    location = /back/  { return 301 /back-office/; }

    # PT 27.10.2026: posle parolya officeplus.una.md rabotaet s nufarul.eminescu.md
    # (front + bek-ofis), oblako (officeplus.md) - po-prezhnemu .250 (@opoffice).
    # Karta adresov vitriny povtoryaet Apache na .250 (officeplus.conf).
    location ^~ /static/ {
        error_page 418 = @opgate;
        error_page 419 = @opoffice;
        if ($op_pass = 0) { return 418; }
        if ($op_cloud = 1) { return 419; }
        expires 7d;
        include /etc/nginx/officeplus-nufarul.inc;
    }

    location / {
        error_page 418 = @opgate;
        error_page 419 = @opoffice;
        if ($op_pass = 0) { return 418; }
        if ($op_cloud = 1) { return 419; }
        rewrite ^/$          /UNA.md/orasldev/biro26-site break;
        rewrite ^/cos$       /UNA.md/orasldev/biro26-site/cart break;
        rewrite ^/cont$      /UNA.md/orasldev/biro26-site/account break;
        rewrite ^/catalog$   /UNA.md/orasldev/biro26-site/catalog break;
        rewrite ^/favorite$  /UNA.md/orasldev/biro26-site/favorites break;
        rewrite ^/compara$   /UNA.md/orasldev/biro26-site/compare break;
        rewrite ^/branduri$  /UNA.md/orasldev/biro26-site/brands break;
        rewrite ^/cerere-credit$ /UNA.md/orasldev/biro26-site/credit-form break;
        rewrite ^/produs/([0-9]+)$ /UNA.md/orasldev/biro26-site/product/$1 break;
        rewrite ^/(despre-noi|contacte|livrare|retur-produse|termeni-si-conditii|politica-de-confidentialitate|credite|b2b-api)$ /UNA.md/orasldev/biro26-site/page/$1 break;
        rewrite ^/back-office/?$ /UNA.md/orasldev/biro26-backoffice break;
        include /etc/nginx/officeplus-nufarul.inc;
    }

    # PT 27.10.2026: trafik oblaka (officeplus.md) - kak ran'she, na .250
    location @opoffice {
        proxy_pass http://192.168.0.250:8001;
    }

    # PT 20260922: stranica vvoda parolya. Otdaetsya na lyuboy adres bez cookie,
    # s sohraneniem URL v adresnoy stroke - posle vvoda JS perezagruzhaet stranicu.
    # PT 20260922: robots.txt otdaem sami, MIMO zaslonki i RAZRESHAYA obhod.
    # Eto namerenno: chtoby staryye adresa (naprimer /catalog s cenami) vypali iz
    # indeksa, Googlebot dolzhen ih skanirovat i videt X-Robots-Tag: noindex.
    # "Disallow: /" zdes sdelal by huzhe - zapret obhoda ostavil by URL v vydache.
    # Kogda vydacha ochistitsya, mozhno zamenit na polnyy zapret.
    location = /robots.txt {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow:\n";
    }

    location @opgate {
        root /usr/share/nginx/html;
        try_files /officeplus-gate.html =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }
}
