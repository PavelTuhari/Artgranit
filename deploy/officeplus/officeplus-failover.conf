# ── Отказоустойчивость магазина ───────────────────────────────────────────
# Внутренняя точка 127.0.0.1:8001. Все маршруты officeplus-hybrid.conf ведут
# сюда, а отсюда запрос идёт в офисную сеть (93.115.136.18). Если офис
# выключен — отвечает локальный Flask этой же машины.
#
# Почему прокси, а не редирект: клиент должен остаться на officeplus.md,
# иначе оплата начнётся с другого имени и адреса возврата в MAIB перестанут
# совпадать с зарегистрированными у банка.
#
# Схема проверена 18.08.2026: офис жив — 2,1-2,9 с; офис выключен —
# автоматический подхват, 6,3-6,5 с, код 200.
# Откат: /root/officeplus-hybrid.conf.before-failover
server {
    listen 127.0.0.1:8001;
    server_name _;

    # тело запроса нужно уметь переслать повторно на запасную
    client_max_body_size 32M;
    proxy_request_buffering on;

    location / {
        proxy_pass https://93.115.136.18;
        # магазин в офисе отвечает на это имя; officeplus.md там пока занят
        # посторонним сайтом — см. описание схемы
        proxy_set_header Host officeplus.una.md;
        proxy_ssl_server_name on;
        proxy_ssl_name officeplus.una.md;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_read_timeout   30s;

        # адреса возврата и canonical возвращаем на наше имя
        proxy_redirect https://officeplus.una.md/ /;
        sub_filter_once off;
        sub_filter_types text/html application/json;
        sub_filter 'officeplus.una.md' 'officeplus.md';

        # офис молчит или отдал ошибку шлюза -> запасная площадка
        proxy_intercept_errors on;
        error_page 502 503 504 = @spare;
        add_header X-Shop-Origin office always;
    }

    location @spare {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header X-Shop-Origin spare always;
    }
}
