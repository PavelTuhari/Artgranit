# Сборка TexFlow Desktop для Windows, macOS и Linux на GitHub Actions.
# Чтобы включить: скопировать в .github/workflows/texflow-desktop.yml (общий каталог репозитория —
# по правилам проекта переносит владелец). Запуск: вкладка Actions → TexFlow Desktop → Run workflow.
# Результат: артефакты TexFlow-<версия>-<ос>-<arch>.zip у запуска.
name: TexFlow Desktop
on:
  workflow_dispatch:
  push:
    paths: ["standalone/texflow/**"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: standalone/texflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Зависимости
        run: python -m pip install pyinstaller==6.11.1 reportlab openpyxl flask pytest
      - name: Тесты ядра
        run: python -m pytest -q
      - name: Сборка
        run: python install/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: TexFlow-${{ matrix.os }}
          path: standalone/texflow/dist/TexFlow-*.zip
