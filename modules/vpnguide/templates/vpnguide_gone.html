<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>OpenVPN</title>
<style>
  :root{--bg:#f6f7f9;--panel:#fff;--line:#dfe3e8;--txt:#1c2128;--dim:#5b6573}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e}
  }
  :root[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:560px;margin:60px auto;padding:0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:10px 0}
  h1{font-size:19px;margin:0 0 6px} p{margin:0;color:var(--dim)}
</style>
</head>
<body>
<main>
  {# Все три языка подряд: человек мог открыть ссылку на любом. #}
  {% for lg in [lang] + (langs | reject('equalto', lang) | list) %}
  <div class="card" lang="{{ lg }}">
    <h1>🔒 {{ t('gone_title', lg) }}</h1>
    <p>{{ t('gone_text', lg) }}</p>
  </div>
  {% endfor %}
</main>
</body>
</html>
