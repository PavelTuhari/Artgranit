<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бэк-офис UNA — журналы и документы</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden;
}

.top-bar {
    background: #16213e; border-bottom: 1px solid #0f3460; height: 46px;
    display: flex; align-items: center; padding: 0 16px; gap: 10px;
}
.top-bar .logo { color: #53d769; font-weight: 700; font-size: 15px; letter-spacing: .5px; }
.top-bar .logo span { color: #e94560; }
.top-bar .crumbs { color: #8888aa; font-size: 12px; }
.top-bar .spacer { flex: 1; }
.back-link { color: #8888aa; text-decoration: none; font-size: 13px; }
.back-link:hover { color: #e94560; }

.layout { display: flex; height: calc(100vh - 46px); }

.sidebar {
    width: 310px; flex: 0 0 310px; background: #16213e;
    border-right: 1px solid #0f3460; overflow-y: auto; padding-bottom: 40px;
}
.group-title {
    padding: 9px 12px 5px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .6px; color: #6a6a88;
}
.journal {
    padding: 6px 12px 6px 20px; font-size: 12px; cursor: pointer;
    color: #c0c0d0; border-left: 2px solid transparent;
}
.journal:hover { background: #1c2b4a; color: #fff; }
.journal.active { background: #0f3460; color: #fff; border-left-color: #e94560; }
.journal .muted { color: #6a6a88; }

.content { flex: 1; overflow-y: auto; padding: 14px 18px 60px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.section-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.section-note { font-size: 12px; color: #8888aa; margin-bottom: 12px; line-height: 1.5; max-width: 900px; }

.card { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; margin-bottom: 14px; }
.card-header {
    padding: 9px 13px; border-bottom: 1px solid #0f3460; font-size: 13px;
    font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px;
}
.card-header .spacer { flex: 1; }
.card-body { padding: 12px; }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 7px 9px; background: #0f3460; color: #a0a0c0; font-weight: 600; white-space: nowrap; }
td { padding: 6px 9px; border-top: 1px solid #0f3460; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #1c2b4a; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

input, select {
    background: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0;
    padding: 5px 8px; border-radius: 4px; font-size: 12px; font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: #e94560; }
label { font-size: 11px; color: #8888aa; margin-right: 4px; }

button {
    background: #0f3460; border: 1px solid #1c4a80; color: #e0e0e0;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit;
}
button:hover { background: #1c4a80; color: #fff; }
button.primary { background: #e94560; border-color: #e94560; color: #fff; }
button.link { background: none; border: none; color: #6ba8ff; padding: 0; }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 16px; }
.kv div { font-size: 12px; }
.kv .k { color: #8888aa; display: block; font-size: 11px; }

.empty-state { padding: 20px; text-align: center; color: #6a6a88; font-size: 12px; }
.note { padding: 9px 12px; background: #1c2b4a; border-left: 2px solid #f5a623; font-size: 12px; color: #c8c8dd; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #0f3460; color: #a0a0c0; }
.badge.gfc { background: #10331c; color: #53d769; }
</style>
</head>
<body>

<div class="top-bar">
    <div class="logo">UNA<span>web</span></div>
    <div class="crumbs" id="crumbs">Журналы</div>
    <div class="spacer"></div>
    <a href="/UNA.md/orasldev" class="back-link">&#8592; Портал</a>
</div>

<div class="layout">
    <div class="sidebar" id="sidebar"><div class="empty-state">Загрузка журналов…</div></div>
    <div class="content" id="content">
        <div class="section-title">Бэк-офис учётной системы</div>
        <div class="section-note">
            Слева — журналы из конфигурации UNA, те же самые, что видит клиент.
            Выберите журнал, чтобы посмотреть его документы. Модуль работает
            только на чтение.
        </div>
    </div>
</div>

<script>
const API = '/UNA.md/orasldev/biro26web/api';
let CURRENT = null;

function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function num(v, digits) {
    if (v === null || v === undefined || v === '') return '';
    const n = Number(v);
    if (Number.isNaN(n)) return esc(v);
    const d = digits === undefined ? 2 : digits;
    return n.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d});
}

async function api(path) {
    const r = await fetch(API + path);
    let body = {};
    try { body = await r.json(); } catch (e) { body = {}; }
    if (!r.ok || body.success === false) throw new Error(body.message || ('Ошибка ' + r.status));
    return body.data;
}

function table(columns, rows, render) {
    if (!rows || !rows.length) return '<div class="empty-state">Нет данных</div>';
    const head = columns.map(c => '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.title) + '</th>').join('');
    return '<table><thead><tr>' + head + '</tr></thead><tbody>' + rows.map(render).join('') + '</tbody></table>';
}

// ── журналы ──────────────────────────────────────────────────────────

async function loadJournals() {
    const box = document.getElementById('sidebar');
    try {
        const tree = await api('/journals');
        const parts = [];
        tree.forEach(group => {
            if (!group.journals || !group.journals.length) return;
            parts.push('<div class="group-title">' + esc(group.title) + '</div>');
            group.journals.forEach(j => {
                parts.push('<div class="journal" data-id="' + j.obj_id + '" '
                    + 'onclick="openJournal(' + j.obj_id + ')">'
                    + esc(j.title) + '</div>');
            });
        });
        box.innerHTML = parts.join('') || '<div class="empty-state">Журналов нет</div>';
    } catch (e) {
        box.innerHTML = '<div class="empty-state">' + esc(e.message) + '</div>';
    }
}

// ── документы журнала ────────────────────────────────────────────────

async function openJournal(id) {
    CURRENT = id;
    document.querySelectorAll('.journal').forEach(el => {
        el.classList.toggle('active', String(el.dataset.id) === String(id));
    });
    await loadDocuments();
}

async function loadDocuments() {
    if (!CURRENT) return;
    const box = document.getElementById('content');
    box.innerHTML = '<div class="empty-state">Загрузка…</div>';

    const from = (document.getElementById('dFrom') || {}).value || '';
    const to = (document.getElementById('dTo') || {}).value || '';
    const q = [];
    if (from) q.push('from=' + encodeURIComponent(from));
    if (to) q.push('to=' + encodeURIComponent(to));

    try {
        const data = await api('/journals/' + CURRENT + '/documents'
            + (q.length ? '?' + q.join('&') : ''));
        document.getElementById('crumbs').textContent = data.journal.title || '';

        const filter = (data.journal.sqlfilter || '').trim();
        const parts = [
            '<div class="section-title">' + esc(data.journal.title) + '</div>',
            '<div class="section-note">Отбор документов задан в конфигурации UNA: '
              + '<code>' + esc(filter || '—') + '</code></div>',
            '<div class="toolbar">'
              + '<label>с</label><input type="date" id="dFrom" value="' + esc(from) + '">'
              + '<label>по</label><input type="date" id="dTo" value="' + esc(to) + '">'
              + '<button class="primary" onclick="loadDocuments()">Показать</button>'
              + '</div>',
        ];

        if (data.note) parts.push('<div class="note">' + esc(data.note) + '</div>');

        parts.push('<div class="card"><div class="card-header">Документы'
            + '<div class="spacer"></div><span class="badge">строк: '
            + (data.rows || []).length + '</span></div>'
            + '<div class="card-body" style="padding:0">'
            + table(
                [{title: 'Номер'}, {title: 'Дата'}, {title: 'Тип документа'},
                 {title: 'Валюта'}, {title: 'Проводок', num: true}, {title: 'Проведён'}],
                data.rows,
                d => '<tr class="clickable" onclick="openDocument(' + d.cod + ')">'
                    + '<td>' + (esc(d.nrmanual) || '<span class="muted">без номера</span>') + '</td>'
                    + '<td>' + esc(d.ddate) + '</td>'
                    + '<td>' + esc(d.type_name || ('SYSFID ' + d.sysfid)) + '</td>'
                    + '<td>' + esc(d.valuta) + '</td>'
                    + '<td class="num">' + esc(d.cm_count) + '</td>'
                    + '<td>' + (Number(d.isgfc) ? '<span class="badge gfc">да</span>' : '') + '</td>'
                    + '</tr>')
            + '</div></div>');

        box.innerHTML = parts.join('');
    } catch (e) {
        box.innerHTML = '<div class="empty-state">' + esc(e.message) + '</div>';
    }
}

// ── карточка документа ───────────────────────────────────────────────

async function openDocument(cod) {
    const box = document.getElementById('content');
    box.innerHTML = '<div class="empty-state">Загрузка документа…</div>';
    try {
        const d = await api('/documents/' + cod);
        const h = d.head;
        const parts = [
            '<div class="toolbar"><button onclick="loadDocuments()">&#8592; к журналу</button></div>',
            '<div class="section-title">' + esc(h.type_name || 'Документ') + ' '
              + (esc(h.nrmanual) || ('#' + h.cod)) + '</div>',
            '<div class="card"><div class="card-header">Шапка</div><div class="card-body">'
              + '<div class="kv">'
              + kv('Номер', h.nrmanual) + kv('Дата', h.ddate)
              + kv('Тип (SYSFID)', h.sysfid) + kv('Модуль', h.docname)
              + kv('Валюта', h.valuta) + kv('Проведён', Number(h.isgfc) ? 'да' : 'нет')
              + kv('Подразделение', h.div) + kv('Автор (USERID)', h.userid)
              + '</div>'
              + (h.txtcomment ? '<div class="note" style="margin-top:10px">'
                    + esc(h.txtcomment) + '</div>' : '')
              + '</div></div>',
        ];

        parts.push('<div class="card"><div class="card-header">Строки</div>'
            + (d.lines_note ? '<div class="card-body"><div class="note">'
                    + esc(d.lines_note) + '</div></div>'
               : '<div class="card-body" style="padding:0">'
                    + table(
                        [{title: 'Код'}, {title: 'Наименование'}, {title: 'Ед.'},
                         {title: 'Кол-во', num: true}, {title: 'Цена', num: true},
                         {title: 'Сумма', num: true}],
                        d.lines,
                        l => '<tr><td>' + esc(l.codvechi || l.ctsc) + '</td>'
                            + '<td>' + esc(l.denumirea) + '</td>'
                            + '<td>' + esc(l.um) + '</td>'
                            + '<td class="num">' + num(l.cant, 3) + '</td>'
                            + '<td class="num">' + num(l.pret) + '</td>'
                            + '<td class="num">' + num(l.suma) + '</td></tr>')
                    + '</div>')
            + '</div>');

        parts.push('<div class="card"><div class="card-header">Проводки</div>'
            + '<div class="card-body" style="padding:0">'
            + table(
                [{title: 'Дата'}, {title: 'Функция'}, {title: 'Дт'}, {title: 'Кт'},
                 {title: 'Кол-во', num: true}, {title: 'Сумма', num: true}],
                d.postings,
                p => '<tr><td>' + esc(p.data) + '</td><td>' + esc(p.funct) + '</td>'
                    + '<td>' + esc(p.dt) + '</td><td>' + esc(p.ct) + '</td>'
                    + '<td class="num">' + num(p.cant, 3) + '</td>'
                    + '<td class="num">' + num(p.suma) + '</td></tr>')
            + '</div></div>');

        box.innerHTML = parts.join('');
    } catch (e) {
        box.innerHTML = '<div class="empty-state">' + esc(e.message) + '</div>';
    }
}

function linesTotal(lines) {
    // Итог считается из показанных строк, а не берётся из базы: общей
    // суммы документа в UNA нет, у каждого семейства своя витрина строк.
    if (!lines || !lines.length) return '';
    const sum = lines.reduce((a, l) => a + (Number(l.suma) || 0), 0);
    return '<div class="card-body" style="text-align:right;border-top:1px solid #0f3460">'
        + '<span class="k" style="color:#8888aa">Итого по строкам: </span><b>'
        + num(sum) + '</b></div>';
}

function kv(k, v) {
    return '<div><span class="k">' + esc(k) + '</span>'
        + (v === null || v === undefined || v === '' ? '—' : esc(v)) + '</div>';
}

loadJournals();
</script>
</body>
</html>
